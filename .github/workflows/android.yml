name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── 3. Install Capacitor CLI globally ────────────────────────────────────
      # Installed globally so `cap` stays on PATH regardless of what
      # `npm run build` does to node_modules.
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      # ── 4. Build the web app ──────────────────────────────────────────────────
      # npm run build internally runs `npm i --silent` which may strip
      # dependencies. We run a full `npm install` afterwards to restore them.
      - name: Install dependencies and build web app
        run: npm install && npm run build

      # ── 5. Restore full node_modules after build ──────────────────────────────
      # The build script's internal `npm i --silent` can drop packages
      # (including @capacitor/android) when NODE_ENV=production is set.
      # A second `npm install` ensures everything is present for `cap add`.
      - name: Restore node_modules
        run: npm install

      # ── 6. Java (required by Gradle) ─────────────────────────────────────────
      # @capacitor/android v8 sets sourceCompatibility = JavaVersion.VERSION_21
      # so Java 21 is required. Java 17 produces "invalid source release: 21".
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── 7. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 8. Accept SDK licenses ───────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 9. Add Android platform and sync ─────────────────────────────────────
      # `cap add android` looks for @capacitor/android in node_modules.
      # `cap sync android` copies dist/ into the android/ native project.
      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            cap add android
          fi

      - name: Sync Capacitor (copy dist/ into android/)
        run: cap sync android

      # ── 10. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 11. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-example-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Build summary ─────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### Android APK built successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To install on a device:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> This is a **debug** build. For Play Store distribution, use \`assembleRelease\` with a signing keystore." >> $GITHUB_STEP_SUMMARY
