name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── 3. Install Capacitor CLI globally FIRST ───────────────────────────────
      # The project's build script runs `npm i --silent` internally which can
      # wipe node_modules and reinstall only production deps, removing any
      # devDependency binaries. Installing @capacitor/cli globally puts `cap`
      # on the system PATH where nothing can touch it.
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      # ── 4. Install project dependencies and build the web app ────────────────
      - name: Install dependencies and build
        run: npm install && npm run build

      # ── 5. Java (required by Gradle) ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 6. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Accept SDK licenses ───────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 8. Add Android platform and sync ─────────────────────────────────────
      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            cap add android
          fi

      - name: Sync Capacitor (copy dist/ into android/)
        run: cap sync android

      # ── 9. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-example-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. Build summary ─────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### Android APK built successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To install on a device:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> This is a **debug** build. For Play Store distribution, use \`assembleRelease\` with a signing keystore." >> $GITHUB_STEP_SUMMARY
