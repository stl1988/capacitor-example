name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + npm cache ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ── 3. Build the web app (produces dist/) ───────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 4. Java (required by Gradle / Android SDK) ──────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 5. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Capacitor: add android platform if not committed, then sync ───────
      #
      # Use ./node_modules/.bin/cap instead of `npx cap` — in CI, npx can fail
      # to locate the binary with "could not determine executable to run" even
      # when @capacitor/cli is installed, because npx rewrites the PATH before
      # checking node_modules/.bin. Calling the binary directly is reliable.
      #
      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            ./node_modules/.bin/cap add android
          fi

      - name: Sync Capacitor (copy dist/ into android/)
        run: ./node_modules/.bin/cap sync android

      # ── 7. Accept SDK licenses (required by Gradle) ──────────────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 8. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-example-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Print download reminder ──────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### Android APK built successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To install on a device:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> This is a **debug** build. For Play Store distribution, use \`assembleRelease\` with a signing keystore." >> $GITHUB_STEP_SUMMARY
